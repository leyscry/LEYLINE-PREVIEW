<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leyline Observatory</title>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b1017;
    color: #d7dde7;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

header {
    padding: 32px 8%;
    border-bottom: 1px solid #253243;
    background: #101720;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 2px;
}

.subtitle {
    margin-top: 8px;
    color: #7f91a8;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 50px 30px;
}

h1 {
    font-size: 34px;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
}

.card {
    display: block;
    padding: 24px;
    border: 1px solid #263647;
    border-radius: 14px;
    background: #121a24;
    text-decoration: none;
    color: #d7dde7;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-3px);
    border-color: #4ba3e3;
}

.card-title {
    font-size: 22px;
    font-weight: 700;
}

.card-subtitle {
    margin-top: 10px;
    color: #8191a5;
}

.file {
    padding: 18px;
    margin-bottom: 12px;
    border: 1px solid #263647;
    border-radius: 10px;
    background: #121a24;
}

.file a {
    color: #61b6f2;
    text-decoration: none;
    font-weight: 600;
}

.file-meta {
    margin-top: 6px;
    color: #77889c;
    font-size: 13px;
}

.back {
    display: inline-block;
    margin-bottom: 30px;
    color: #61b6f2;
    text-decoration: none;
}

footer {
    padding: 30px;
    text-align: center;
    color: #617286;
    font-size: 13px;
}

</style>


</head>

<body>

<header>

<div class="logo">
🔮 LEYLINE OBSERVATORY
</div>

<div class="subtitle">
Market Intelligence · Automated Reports
</div>

</header>

<main>



<h1>LEYLINE REPORTS</h1>

<p style="color:#8191a5;margin-bottom:35px">
Latest intelligence from the Leyline Scout network.
</p>

<div class="grid">


<a class="card" href="stablecoin/">

<div class="card-title">
STABLECOIN
</div>

<div class="card-subtitle">
2 latest reports
</div>

</a>

<a class="card" href="marco/">

<div class="card-title">
MARCO
</div>

<div class="card-subtitle">
1 latest reports
</div>

</a>


</div>


</main>

<footer>

Generated automatically · 2026-09-05 20:01 UTC

</footer>

</body>

</html>
